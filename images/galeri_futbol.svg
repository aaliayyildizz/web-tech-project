<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0505;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#0D1B2A;stop-opacity:0.85" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  
  <!-- Arka plan -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Dekoratif çizgiler -->
  <line x1="0" y1="240.0" x2="400" y2="160.0" stroke="#D4AF37" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="120.0" x2="400" y2="280.0" stroke="#D4AF37" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Grid desen -->
  <line x1="0" y1="0" x2="0" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="60" y1="0" x2="60" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="120" y1="0" x2="120" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="180" y1="0" x2="180" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="240" y1="0" x2="240" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="300" y1="0" x2="300" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="360" y1="0" x2="360" y2="400" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="0" x2="400" y2="0" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="0" y1="60" x2="400" y2="60" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="0" y1="120" x2="400" y2="120" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="0" y1="180" x2="400" y2="180" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="0" y1="240" x2="400" y2="240" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="0" y1="300" x2="400" y2="300" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/><line x1="0" y1="360" x2="400" y2="360" stroke="#D4AF37" stroke-width="0.3" opacity="0.06"/>
  
  <!-- Merkez dekorasyon -->
  <circle cx="200" cy="200" r="112.00000000000001" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.12"/>
  <circle cx="200" cy="200" r="88.0" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.08"/>
  
  <!-- Alt gradient overlay -->
  <rect width="400" height="400" fill="url(#overlay)"/>
  
  <!-- Emoji (büyük) -->
  <text x="200" y="170" font-size="100" text-anchor="middle" dominant-baseline="middle" opacity="0.35">⚽</text>
  
  <!-- Başlık -->
  <text x="200" y="310" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#D4AF37" text-anchor="middle" letter-spacing="2">Sivasspor</text>
  
  <!-- Alt başlık -->
  <text x="200" y="345" font-size="9" font-family="Arial, sans-serif" fill="#aab8c2" text-anchor="middle">Kırmızı-Sarı Tutku</text>
  
  <!-- Sol üst köşe dekor -->
  <text x="30" y="45" font-size="24" font-family="Georgia" fill="#D4AF37" opacity="0.6">✦</text>
  <text x="350" y="45" font-size="24" font-family="Georgia" fill="#D4AF37" opacity="0.6">✦</text>
</svg>