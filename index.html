<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap – Ali Ayyıldız</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-page" style="min-height:100vh;">
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">✦ AA</div>
    <h2 style="text-align:center;font-size:1.3rem;margin-bottom:0.25rem;">Hoş Geldiniz</h2>
    <p style="text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:2rem;">Devam etmek için giriş yapın</p>

    <!-- Hata mesajı (PHP'den yönlendirme ile) -->
    <div id="errorBox" class="alert-custom alert-danger" style="display:none;"></div>

    <form id="loginForm" action="php/login.php" method="POST" novalidate>

      <div class="form-group-custom">
        <label class="form-label-custom" for="email">E-posta</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control-custom"
          placeholder="ali.ayyildiz2@ogr.sakarya.edu.tr"
          autocomplete="email"
        />
        <span class="error-text" id="emailError">Geçerli bir e-posta adresi girin.</span>
      </div>

      <div class="form-group-custom">
        <label class="form-label-custom" for="password">Şifre</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control-custom"
          placeholder="••••••••••"
          autocomplete="current-password"
        />
        <span class="error-text" id="passwordError">Şifre alanı boş bırakılamaz.</span>
      </div>

      <button type="submit" class="btn-gold" style="width:100%;margin-top:0.5rem;">
        Giriş Yap
      </button>
    </form>

    <p style="text-align:center;color:var(--muted);font-size:0.78rem;margin-top:1.5rem;">
      Kullanıcı adı: öğrenci e-posta &nbsp;|&nbsp; Şifre: öğrenci numarası
    </p>
  </div>
</div>

<script>
  /* URL parametresinden hata mesajı göster */
  const params = new URLSearchParams(window.location.search);
  const err = params.get('error');
  const errorBox = document.getElementById('errorBox');
  if (err === 'empty') {
    errorBox.textContent = 'Lütfen tüm alanları doldurun.';
    errorBox.style.display = 'block';
  } else if (err === 'invalid') {
    errorBox.textContent = 'E-posta veya şifre hatalı. Lütfen tekrar deneyin.';
    errorBox.style.display = 'block';
  }

  /* Client-side validasyon */
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    let valid = true;

    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    // E-posta kontrolü
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email.value || !emailRegex.test(email.value)) {
      emailError.classList.add('visible');
      email.style.borderColor = '#ff6b6b';
      valid = false;
    } else {
      emailError.classList.remove('visible');
      email.style.borderColor = '';
    }

    // Şifre kontrolü
    if (!password.value) {
      passwordError.classList.add('visible');
      password.style.borderColor = '#ff6b6b';
      valid = false;
    } else {
      passwordError.classList.remove('visible');
      password.style.borderColor = '';
    }

    if (!valid) e.preventDefault();
  });
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
